name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # "last updated" dates come from git history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SPICE suite (results page)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ngspice
          python -m pip install -q pytest numpy scipy
          # the report is published even when a check fails; the Simulation workflow is the gate
          python -m pytest hardware/sim -q -m "not slow" || true
          test -f hardware/sim/results/report.md || printf '# SPICE suite results\n\nNo results were produced in this build.\n' > hardware/sim/results/report.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
