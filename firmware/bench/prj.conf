# Rev B bench firmware, nRF52840-DK. Shell and log share the DK VCOM (uart0, 115200):
# the shell carries the log, so there is no separate UART log backend.

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_DISPLAY=y

# nrfx NFCT driven directly by the app's Type 2 tag (src/nfc.c).
CONFIG_NRFX_NFCT=y

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_ARGC_MAX=20
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_MAIN_STACK_SIZE=4096

# DWT cycle counter for TE and frame timing (64 MHz, rather than the 32 kHz RTC).
CONFIG_TIMING_FUNCTIONS=y

CONFIG_REBOOT=y
